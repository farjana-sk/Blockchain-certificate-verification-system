<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | CertiChain Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        .background-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -5; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.7) 100%); z-index: -4; }
        .bg-image { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('https://images.unsplash.com/photo-1557683316-973673baf926?ixlib=rb-4.0.3&auto=format&fit=crop&w=2029&q=80'); background-size: cover; background-position: center; filter: blur(2px); transform: scale(1.1); z-index: -6; animation: slowZoom 30s infinite alternate; }
        @keyframes slowZoom { 0% { transform: scale(1.1); } 100% { transform: scale(1.3); } }
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -3; overflow: hidden; }
        .particle { position: absolute; width: 6px; height: 6px; background: rgba(255,215,0,0.3); border-radius: 50%; animation: float 15s infinite linear; }
        @keyframes float { from { transform: translateY(100vh) translateX(-50vw); } to { transform: translateY(-100vh) translateX(50vw); } }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; position: relative; z-index: 10; }
        .glass-card { background: rgba(255,255,255,0.08); backdrop-filter: blur(20px); border: 1px solid rgba(255,215,0,0.2); border-radius: 50px; box-shadow: 0 30px 60px rgba(0,0,0,0.5); transition: all 0.4s ease; }
        .glass-card:hover { border-color: rgba(255,215,0,0.3); box-shadow: 0 40px 80px rgba(0,0,0,0.6); }
        .auth-card { max-width: 500px; width: 100%; padding: 50px 40px; margin: 0 auto; border-top: 5px solid #3b82f6; }
        .auth-header { text-align: center; margin-bottom: 30px; }
        .auth-header h1 { font-size: 2.5rem; font-weight: 800; background: linear-gradient(135deg, #fff 0%, #3b82f6 50%, #fff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        .auth-header h1 i { color: #3b82f6; margin-right: 10px; }
        .auth-header p { color: rgba(255,255,255,0.9); font-size: 1rem; }
        .badge { display: inline-block; padding: 5px 15px; background: rgba(59,130,246,0.2); border: 1px solid #3b82f6; border-radius: 30px; color: #3b82f6; margin-top: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: white; font-weight: 500; }
        label i { margin-right: 8px; color: #3b82f6; }
        input { width: 100%; padding: 15px 20px; background: rgba(255,255,255,0.1); border: 2px solid rgba(59,130,246,0.2); border-radius: 30px; font-size: 1rem; color: white; transition: all 0.3s; }
        input:focus { outline: none; border-color: #3b82f6; background: rgba(0,0,0,0.5); box-shadow: 0 0 40px rgba(59,130,246,0.3); }
        button { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; border: none; padding: 16px 32px; border-radius: 50px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all 0.3s; width: 100%; margin-top: 20px; }
        button:hover { transform: translateY(-5px); box-shadow: 0 20px 50px rgba(59,130,246,0.5); }
        .message { padding: 12px 20px; border-radius: 30px; margin-bottom: 20px; display: none; font-weight: 500; text-align: center; }
        .success-message { background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #10b981; }
        .error-message { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; }
        .info-message { background: rgba(59,130,246,0.2); border: 1px solid #3b82f6; color: #3b82f6; }
        .auth-toggle { text-align: center; margin-top: 20px; }
        .auth-toggle a { color: rgba(255,255,255,0.7); text-decoration: none; cursor: pointer; }
        .auth-toggle a:hover { color: #3b82f6; }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: rgba(255,255,255,0.7); text-decoration: none; }
        .back-link a:hover { color: #3b82f6; }
    </style>
</head>
<body>
    <div class="background-layer"><div class="bg-image"></div><div class="overlay"></div><div class="particles" id="particles"></div></div>
    <div class="container">
        <div class="glass-card auth-card" data-aos="fade-up">
            <div class="auth-header">
                <h1><i class="fas fa-user-shield"></i> Admin Portal</h1>
                <p>Certificate Management Access</p>
                <div class="badge"><i class="fas fa-certificate"></i> Issue & Manage Certificates</div>
            </div>
            <div id="message" class="message"></div>
            <div id="loginForm">
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="loginEmail" placeholder="admin@certificate.com" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter password" required>
                    </div>
                    <button type="submit"><i class="fas fa-sign-in-alt"></i> Login to Admin Panel</button>
                </form>
                <div class="auth-toggle"><a onclick="toggleAuthMode()">Don't have an account? Request Access</a></div>
            </div>
            <div id="signupForm" style="display: none;">
                <form onsubmit="handleSignup(event)">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Full Name</label>
                        <input type="text" id="signupName" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="signupEmail" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Password</label>
                        <input type="password" id="signupPassword" placeholder="Create password" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Confirm Password</label>
                        <input type="password" id="signupConfirmPassword" placeholder="Confirm password" required>
                    </div>
                    <button type="submit"><i class="fas fa-paper-plane"></i> Request Admin Access</button>
                </form>
                <div class="auth-toggle"><a onclick="toggleAuthMode()">Already have an account? Login</a></div>
            </div>
            <div class="back-link"><a href="/"><i class="fas fa-arrow-left"></i> Back to Main Page</a></div>
        </div>
    </div>
    <script>
        AOS.init({ duration: 1000, once: true });
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (10 + Math.random() * 20) + 's';
                container.appendChild(particle);
            }
        }
        createParticles();
        
        function toggleAuthMode() {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
            } else {
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
            }
        }
        
        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.className = `message ${type}-message`;
            messageDiv.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${message}`;
            messageDiv.style.display = 'block';
            setTimeout(() => messageDiv.style.display = 'none', 5000);
        }
        
        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            showMessage('Logging in...', 'info');
            try {
                const response = await fetch('/api/auth/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (data.success) {
                    showMessage('Login successful! Redirecting...', 'success');
                    setTimeout(() => window.location.href = '/admin/dashboard', 1500);
                } else {
                    showMessage(data.message || 'Invalid credentials or account not approved', 'error');
                }
            } catch (error) {
                showMessage('Network error', 'error');
            }
        }
        
        async function handleSignup(event) {
            event.preventDefault();
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;
            if (password !== confirmPassword) { showMessage('Passwords do not match', 'error'); return; }
            if (password.length < 6) { showMessage('Password must be at least 6 characters', 'error'); return; }
            showMessage('Requesting access...', 'info');
            try {
                const response = await fetch('/api/auth/admin/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await response.json();
                if (data.success) {
                    showMessage('Request submitted! Waiting for Super Admin approval.', 'success');
                    setTimeout(() => { toggleAuthMode(); document.getElementById('loginEmail').value = email; }, 2000);
                } else {
                    showMessage(data.message || 'Request failed', 'error');
                }
            } catch (error) {
                showMessage('Network error', 'error');
            }
        }
    </script>
</body>
</html>
